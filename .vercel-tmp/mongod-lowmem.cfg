# mongod.conf — low-memory optimized (patched for 4GB RAM system)

# Where and how to store data.
storage:
  dbPath: C:\Program Files\MongoDB\Server\7.0\data
  wiredTiger:
    engineConfig:
      cacheSizeGB: 0.25

# where to write logging data.
systemLog:
  destination: file
  logAppend: true
  path:  C:\Program Files\MongoDB\Server\7.0\log\mongod.log

# network interfaces
net:
  port: 27017
  bindIp: 127.0.0.1
